name: Package Venworks Canvas Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

###############################################################################
# CONFIG: Update these for this creation.
#
# UPLOAD_TO_NEXUSMODS is the global upload gate. Each UPLOAD_<KEY>_TO_NEXUSMODS
# switch independently controls one release variant.
#
# Store the API key as a repository Actions secret. Store file IDs as repository Actions variables because they are not sensitive.
#
#   - NEXUSMODS_API_KEY the API key to use see https://www.nexusmods.com/settings/api-keys use the developer API key at the bottom of the page
#   - NEXUSMODS_FILE_ID_<KEY> the FILE IDs to replace in the Mod's Files section for each variant:
#       To get a file ID to use in this action, you need to have created a mod page on Nexus Mods and uploaded at least one file. The file ID
#       can be found by checking the "API Info" option in the Files tab of the public-facing mod page, or in the edit menu of the Manage Files page.
#       Configure file IDs as repository Actions variables. A missing file ID skips only that package's Nexus upload so its first package can
#       be uploaded manually. Existing repository secrets with the same names remain supported as fallbacks.
###############################################################################
env:
  UPLOAD_TO_NEXUSMODS: true
  UPLOAD_CANVAS_TO_NEXUSMODS: true
  UPLOAD_EXAMPLE_TO_NEXUSMODS: true
  UPLOAD_COMPONENTGALLERY_TO_NEXUSMODS: true

  NEXUSMODS_FILE_ID_CANVAS: ${{ vars.NEXUSMODS_FILE_ID_CANVAS || secrets.NEXUSMODS_FILE_ID_CANVAS }}
  NEXUSMODS_FILE_ID_EXAMPLE: ${{ vars.NEXUSMODS_FILE_ID_EXAMPLE || secrets.NEXUSMODS_FILE_ID_EXAMPLE }}
  NEXUSMODS_FILE_ID_COMPONENTGALLERY: ${{ vars.NEXUSMODS_FILE_ID_COMPONENTGALLERY || secrets.NEXUSMODS_FILE_ID_COMPONENTGALLERY }}

jobs:
  validate-tag-source:
    name: Validate Tag Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Verify tag and master HEAD
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          if [ "$TAG_CREATED" != "true" ]; then
            echo "Release tag '$TAG_NAME' was updated instead of newly created."
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG_NAME' must use the vX.Y.Z format."
            exit 1
          fi

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          DEFAULT_BRANCH_SHA="$(gh api "repos/${{ github.repository }}/commits/${DEFAULT_BRANCH}" --jq '.sha')"
          if [ "$TAG_SHA" != "$DEFAULT_BRANCH_SHA" ]; then
            echo "Tag is not on the current ${DEFAULT_BRANCH} HEAD."
            echo "Tag SHA: $TAG_SHA"
            echo "${DEFAULT_BRANCH} SHA: $DEFAULT_BRANCH_SHA"
            exit 1
          fi

          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

  package-release:
    name: Package Release
    needs: validate-tag-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_VERSION: ${{ needs.validate-tag-source.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Prepare release packages
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          & "$env:GITHUB_WORKSPACE/Tools/createReleasePackagesV2.ps1" `
            -OutputDirectory $releaseRoot `
            -SkipEnvironment

          $releaseFiles = @(Get-ChildItem -LiteralPath $releaseRoot -File -Filter '*.zip')
          if ($releaseFiles.Count -ne 12) {
            throw "Expected 12 release ZIPs; found $($releaseFiles.Count)."
          }

          "release_root=$releaseRoot" >> $env:GITHUB_OUTPUT

      - name: Upload release package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: venworks-canvas-release-${{ env.PACKAGE_VERSION }}
          path: artifacts/release/*.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub and Nexus Releases
    needs:
      - validate-tag-source
      - package-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.validate-tag-source.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release variant configuration
        id: variant-config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          . "$env:GITHUB_WORKSPACE/Tools/sharedConfig.ps1" -SkipEnvironment
          foreach ($variant in $Global:ModuleVariants) {
            $key = $variant.VariantKey.ToLowerInvariant()
            "$($key)_nexus_display_name=$($variant.NexusDisplayName)" >> $env:GITHUB_OUTPUT
            $category = if ($key -eq 'canvas') { 'main' } else { 'optional' }
            "$($key)_nexus_category=$category" >> $env:GITHUB_OUTPUT
          }

      - name: Download release package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: venworks-canvas-release-${{ env.PACKAGE_VERSION }}
          path: ./artifacts/release

      - name: Extract release notes
        id: release-notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:PACKAGE_VERSION
          $changeLogPath = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          $releaseNotesPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release/release-notes.md'
          $nexusDescriptionPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release/nexus-description.bbcode'
          $releaseNotes = "Release $version"

          if ([System.IO.File]::Exists($changeLogPath)) {
            $content = Get-Content -LiteralPath $changeLogPath -Raw
            $escapedVersion = [Regex]::Escape($version)
            $pattern = "(?ms)^## Version $escapedVersion\s*.*?(?=^## Version \d+\.\d+\.\d+|\z)"
            $match = [Regex]::Match($content, $pattern)

            if ($match.Success) {
              $releaseNotes = $match.Value.Trim()
            }
            else {
              Write-Warning "Unable to find release notes in CHANGELOG.md for version $version. Using fallback release notes."
            }
          }
          else {
            Write-Warning "CHANGELOG.md was not found. Using fallback release notes."
          }

          [System.IO.File]::WriteAllText($releaseNotesPath, $releaseNotes)

          $lines = $releaseNotes -split "\r?\n"
          $bbcodeLines = [System.Collections.Generic.List[string]]::new()
          $inList = $false

          foreach ($line in $lines) {
            if ($line -match '^\s*-\s+(.*)$') {
              if (-not $inList) {
                $bbcodeLines.Add('[list]')
                $inList = $true
              }

              $bbcodeLines.Add("[*]$($Matches[1])")
              continue
            }

            if ($inList) {
              $bbcodeLines.Add('[/list]')
              $inList = $false
            }

            if ($line -match '^##\s+(.+)$') {
              $bbcodeLines.Add("[b]$($Matches[1])[/b]")
              continue
            }

            if ($line -match '^###\s+(.+)$') {
              $bbcodeLines.Add("[b]$($Matches[1])[/b]")
              continue
            }

            $convertedLine = $line -replace '\*\*(.+?)\*\*', '[b]$1[/b]'
            $convertedLine = $convertedLine -replace '\*(.+?)\*', '[i]$1[/i]'
            $convertedLine = $convertedLine -replace '`(.+?)`', '$1'
            $bbcodeLines.Add($convertedLine)
          }

          if ($inList) {
            $bbcodeLines.Add('[/list]')
          }

          $nexusDescription = ($bbcodeLines -join [Environment]::NewLine).Trim()
          [System.IO.File]::WriteAllText($nexusDescriptionPath, $nexusDescription)

          "release_notes_path=$releaseNotesPath" >> $env:GITHUB_OUTPUT
          "nexus_description_path=$nexusDescriptionPath" >> $env:GITHUB_OUTPUT

          $delimiter = [Guid]::NewGuid().ToString()
          "nexus_description<<$delimiter" >> $env:GITHUB_OUTPUT
          $nexusDescription >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Resolve release packages
        id: release-package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          . "$env:GITHUB_WORKSPACE/Tools/sharedConfig.ps1" -SkipEnvironment
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          $expectedPackageNames = [System.Collections.Generic.List[string]]::new()

          foreach ($variant in $Global:ModuleVariants) {
            $key = $variant.VariantKey.ToLowerInvariant()
            $cleanDisplayName = $variant.ReleaseDisplayName -replace ' - ', '-' -replace ' ', '-'
            $packageSuffixes = @(Get-VariantReleasePackageSuffixes -Variant $variant)
            foreach ($packageSuffix in $packageSuffixes) {
              $cleanSuffix = switch ($packageSuffix) {
                'Nexus PC' { '' }
                'Bethesda PC' { 'Bethesda-PC' }
                'Bethesda Xbox' { 'Bethesda-Xbox' }
                'Bethesda PS5' { 'Bethesda-PS5' }
                default { $packageSuffix }
              }
              $packageName = if ($cleanSuffix) { "$cleanDisplayName-$cleanSuffix.zip" } else { "$cleanDisplayName.zip" }
              $expectedPackageNames.Add($packageName)
              $packagePath = Join-Path $releaseRoot $packageName
              if (-not [System.IO.File]::Exists($packagePath)) {
                throw "Unable to find release package '$packageName' for version $env:PACKAGE_VERSION."
              }
              if ((Get-Item -LiteralPath $packagePath).Length -le 0) {
                throw "Release package '$packageName' is empty."
              }
            }

            if ('Nexus PC' -in $packageSuffixes) {
              $normalPath = Join-Path $releaseRoot "$cleanDisplayName.zip"
              "$($key)_normal_path=$normalPath" >> $env:GITHUB_OUTPUT
            }
          }

          $actualPackageNames = @(
            Get-ChildItem -LiteralPath $releaseRoot -File -Filter '*.zip' |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $expectedPackageNames = @($expectedPackageNames | Sort-Object)
          if ($actualPackageNames.Count -ne $expectedPackageNames.Count) {
            throw "Expected $($expectedPackageNames.Count) release packages; found $($actualPackageNames.Count)."
          }
          for ($index = 0; $index -lt $expectedPackageNames.Count; $index++) {
            if ($actualPackageNames[$index] -cne $expectedPackageNames[$index]) {
              throw "Downloaded release package set contains unexpected files."
            }
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release-notes.outputs.release_notes_path }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/release/*.zip

      - name: Validate Nexus Mods upload configuration
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true }}
        shell: bash
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUS_DISPLAY_NAME_CANVAS: ${{ steps.variant-config.outputs.canvas_nexus_display_name }}
          NEXUS_DISPLAY_NAME_EXAMPLE: ${{ steps.variant-config.outputs.example_nexus_display_name }}
          NEXUS_DISPLAY_NAME_COMPONENTGALLERY: ${{ steps.variant-config.outputs.componentgallery_nexus_display_name }}
        run: |
          configured_uploads=0

          check_upload() {
            local file_id="$1"
            local display_name="$2"
            local variant_name="$3"
            local display_name_length=${#display_name}

            if [ -z "$display_name" ]; then
              echo "::error::Nexus Mods display name for $variant_name is empty."
              exit 1
            fi
            if [ "$display_name_length" -gt 50 ]; then
              echo "::error::Nexus Mods display name for $variant_name is $display_name_length characters; the maximum is 50: $display_name"
              exit 1
            fi

            if [ -n "$file_id" ]; then
              echo "Ready to upload $display_name."
              configured_uploads=$((configured_uploads + 1))
            else
              echo "::notice::Skipping $display_name because Nexus Mods file ID is not configured."
            fi
          }

          check_variant_uploads() {
            local upload_enabled="$1"
            local variant_label="$2"
            local file_id="$3"
            local display_name="$4"
            local var_name="$5"

            case "$upload_enabled" in
              true)
                check_upload "$file_id" "$display_name" "$var_name"
                ;;
              false)
                echo "::notice::Skipping $variant_label Nexus Mods upload because its variant upload switch is false."
                ;;
              *)
                echo "::error::Nexus Mods upload switch for $variant_label must be true or false; found '$upload_enabled'."
                exit 1
                ;;
            esac
          }

          check_variant_uploads "$UPLOAD_CANVAS_TO_NEXUSMODS" "Canvas" "$NEXUSMODS_FILE_ID_CANVAS" "$NEXUS_DISPLAY_NAME_CANVAS" "CANVAS"
          check_variant_uploads "$UPLOAD_EXAMPLE_TO_NEXUSMODS" "Example" "$NEXUSMODS_FILE_ID_EXAMPLE" "$NEXUS_DISPLAY_NAME_EXAMPLE" "EXAMPLE"
          check_variant_uploads "$UPLOAD_COMPONENTGALLERY_TO_NEXUSMODS" "Component Gallery" "$NEXUSMODS_FILE_ID_COMPONENTGALLERY" "$NEXUS_DISPLAY_NAME_COMPONENTGALLERY" "COMPONENTGALLERY"

          if [ "$configured_uploads" -gt 0 ] && [ -z "$NEXUSMODS_API_KEY" ]; then
            echo "NEXUSMODS_API_KEY is required for Nexus Mods uploads."
            exit 1
          fi

          echo "$configured_uploads Nexus Mods upload(s) configured."

      - name: Upload Canvas normal release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_CANVAS_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_CANVAS != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_CANVAS }}
          filename: ${{ steps.release-package.outputs.canvas_normal_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ steps.variant-config.outputs.canvas_nexus_category }}
          display_name: ${{ steps.variant-config.outputs.canvas_nexus_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Example normal release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_EXAMPLE_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_EXAMPLE != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_EXAMPLE }}
          filename: ${{ steps.release-package.outputs.example_normal_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ steps.variant-config.outputs.example_nexus_category }}
          display_name: ${{ steps.variant-config.outputs.example_nexus_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Component Gallery normal release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_COMPONENTGALLERY_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_COMPONENTGALLERY != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_COMPONENTGALLERY }}
          filename: ${{ steps.release-package.outputs.componentgallery_normal_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ steps.variant-config.outputs.componentgallery_nexus_category }}
          display_name: ${{ steps.variant-config.outputs.componentgallery_nexus_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}